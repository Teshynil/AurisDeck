services:
  aurisdeck:
    build:
      context: .
      dockerfile: Dockerfile
    image: aurisdeck:latest
    container_name: aurisdeck
    restart: unless-stopped
    ports:
      - "${AURISDECK_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      HF_HOME: /data/models
      AURISDECK_DATA_DIR: /data
