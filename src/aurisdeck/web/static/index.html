<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="base-path" content="">
  <title>AurisDeck</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="#transcribe" id="brand-link">
          <span class="brand-mark" aria-hidden="true">AD</span>
          <h1 class="brand-name" data-i18n="nav.brand">AurisDeck</h1>
        </a>

        <nav class="nav-tabs" id="main-nav" aria-label="Navigation">
          <button type="button" class="nav-tab is-active" data-tab="transcribe" data-i18n="nav.transcribe">Transcribir</button>
          <button type="button" class="nav-tab" data-tab="library" data-i18n="nav.library">Biblioteca</button>
          <button type="button" class="nav-tab" data-tab="viewer" data-i18n="nav.viewer">Visor</button>
          <button type="button" class="nav-tab" data-tab="profiles" data-i18n="nav.profiles">Perfiles</button>
          <button type="button" class="nav-tab" data-tab="settings" data-i18n="nav.settings">Configuración</button>
        </nav>

        <div class="header-actions">
          <span id="header-devices-badge" class="badge badge-cpu" title="Hardware">
            <span data-i18n="common.loading">Cargando...</span>
          </span>
          <button
            type="button"
            id="theme-toggle-btn"
            class="btn btn-ghost btn-icon"
            data-i18n-title="nav.theme_toggle"
            data-i18n-aria-label="nav.theme_toggle"
            title="Cambiar tema"
          >
            <span id="theme-toggle-icon" aria-hidden="true">◐</span>
          </button>
          <button
            type="button"
            id="logout-btn"
            class="btn btn-secondary btn-sm hidden"
            data-i18n="nav.logout"
          >
            Cerrar sesión
          </button>
        </div>
      </div>
    </header>

    <main id="app-main" class="app-main">
      <section id="view-transcribe" class="view-section" data-view="transcribe">
        <div class="card">
          <label class="dropzone" for="simple-file-input">
            <span class="dropzone-title" data-i18n="simple.dropzone_title">Arrastra tus archivos aquí o haz clic para seleccionar</span>
            <span class="dropzone-hint" data-i18n="simple.dropzone_hint">Soporta .m4a, .mp3, .wav, .flac, .ogg, .opus, .aac, .mp4, .mkv, .webm, .mov y .zip</span>
            <input
              id="simple-file-input"
              class="sr-only"
              type="file"
              multiple
              accept=".m4a,.mp3,.wav,.flac,.ogg,.opus,.aac,.mp4,.mkv,.webm,.mov,.zip"
            >
          </label>
        </div>
      </section>

      <section id="view-library" class="view-section hidden" data-view="library"></section>
      <section id="view-viewer" class="view-section hidden" data-view="viewer"></section>
      <section id="view-profiles" class="view-section hidden" data-view="profiles"></section>
      <section id="view-settings" class="view-section hidden" data-view="settings"></section>
    </main>
  </div>

  <div id="login-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="login-modal-title" aria-hidden="true">
    <div class="modal">
      <div class="modal-header">
        <h2 id="login-modal-title" class="modal-title" data-i18n="settings.auth.title">Acceso a AurisDeck</h2>
      </div>
      <form id="login-form">
        <div class="modal-body">
          <p class="muted" style="margin: 0;" data-i18n="settings.auth.description">Introduce la contraseña compartida para continuar.</p>
          <div class="form-group">
            <label class="label" for="login-password" data-i18n="settings.auth.password_label">Contraseña</label>
            <input
              id="login-password"
              class="input"
              type="password"
              autocomplete="current-password"
              required
              data-i18n-placeholder="settings.auth.password_placeholder"
              placeholder="Contraseña de acceso"
            >
          </div>
          <div id="login-error" class="form-error hidden" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button type="submit" id="login-submit" class="btn btn-primary" data-i18n="settings.auth.login_button">Entrar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
